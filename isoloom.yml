# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# Golden Hat Society (secDevLabs, by Globo.com) as an Isoloom spec: a Flask app behind a
# mitmproxy 5.3.0 reverse proxy that blocks /golden.secret, a Vulnerable and Outdated Component
# (HTTP request smuggling, CVE-2021-39214). Vendored unchanged in build/app/app/ (the app folder
# owasp-top10-2021-apps/a6/golden-hat of secDevLabs), built by an overlay of upstream's
# Dockerfile. `isoloom generate`, then `isoloom run docker`.
version: 1
name: secdevlabs-golden-hat

networks:
  lab: { cidr: 10.60.105.0/24, internet: false }

machines:
  app:
    networks: { lab: 10 }
    services: [{ port: 10006, name: web, http: true, publish: 10006 }]
    resources: { cpus: 1, memory_mb: 512 }
    docker:
      build: build/app

checks:
  - name: the club page answers
    http: http://app:10006/
    wait: 120
  - name: mitmproxy 5.3.0 blocks /golden.secret
    script: checks/proxy.sh

message: |
  The Golden Hat Society answers at http://localhost:{{ machines.app.services.0.publish }}/. Its
  secret is at /golden.secret, but the proxy in front only lets the club in. Read the headers.
